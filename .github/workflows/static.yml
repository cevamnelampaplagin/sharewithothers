# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If you have a build step (npm run build, hugo, etc.), add it here and set path to build output:
      # - name: Build site
      #   run: npm run build
      #
      # Then set path: './public' or './dist' below instead of '.'.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages (single)
        # Use the recommended upload-pages-artifact action (stable version)
        uses: actions/upload-pages-artifact@v1
        with:
          # Prefer specifying the build output directory if you have one (e.g. './public' or './dist').
          # Using '.' uploads the whole repository; keep it only if that's intended.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
